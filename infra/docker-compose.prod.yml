name: neuroflow

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: neuroflow
      POSTGRES_USER: neuroflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroflow -d neuroflow -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {memory: 2g, cpus: "2.0"}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {memory: 512m, cpus: "0.5"}
    restart: unless-stopped

  mlflow:
    build: ./mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,mlflow,localhost:5000,127.0.0.1:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
    image: neuroflow-backend:latest
    env_file: ../.env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - ./init:/app/init:ro
      - uploads:/data/uploads
      - models:/data/models
    deploy:
      replicas: 2
      resources:
        limits: {memory: 1g, cpus: "1.0"}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  worker:
    image: neuroflow-backend:latest
    command: python -m worker
    env_file: ../.env
    environment:
      OTEL_SERVICE_NAME: neuroflow-worker
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - models:/data/models
    healthcheck:
      disable: true
    deploy:
      replicas: 2
      resources:
        limits: {memory: 2g, cpus: "2.0"}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://localhost/api
    deploy:
      resources:
        limits: {memory: 512m, cpus: "0.5"}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  models: