[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroflow-sdk"
version = "0.1.0"
description = "Python SDK for the NeuroFlow RAG platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["neuroflow*"]